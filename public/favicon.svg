  <path d="M8 20 C12 18, 20 18, 24 20" stroke="#e91e63" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Motion lines to indicate pitching -->
   <g stroke="#a876ff" stroke-width="2" stroke-linecap="round">
